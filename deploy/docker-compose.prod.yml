# Production overlay for MailForge
# Usage:
#   export IMAGE_API=ghcr.io/<owner>/mailforge-api:latest
#   export IMAGE_WORKER=ghcr.io/<owner>/mailforge-worker:latest
#   export IMAGE_FRONTEND=ghcr.io/<owner>/mailforge-frontend:latest
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d

services:
  api:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  worker:
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped
