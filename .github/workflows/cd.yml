name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: false
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mailforge

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: |
          dotnet restore MailForge.sln
          dotnet test MailForge.sln --configuration Release --verbosity normal

  publish-images:
    name: Publish Container Images
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: src/Api/Dockerfile
            context: .
          - service: worker
            dockerfile: src/Workers/Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:5000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.example.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment manifest
        run: |
          mkdir -p deploy
          cat > deploy/staging.env <<EOF
          IMAGE_API=${{ env.IMAGE_PREFIX }}-api:sha-${GITHUB_SHA::7}
          IMAGE_WORKER=${{ env.IMAGE_PREFIX }}-worker:sha-${GITHUB_SHA::7}
          IMAGE_FRONTEND=${{ env.IMAGE_PREFIX }}-frontend:sha-${GITHUB_SHA::7}
          DEPLOY_ENV=staging
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-manifest
          path: deploy/staging.env
          retention-days: 14

      - name: Deploy placeholder
        run: |
          echo "Images published to GHCR."
          echo "Connect your staging host (VM/Kubernetes/ECS) to pull:"
          echo "  ${{ env.IMAGE_PREFIX }}-api:sha-${GITHUB_SHA::7}"
          echo "  ${{ env.IMAGE_PREFIX }}-worker:sha-${GITHUB_SHA::7}"
          echo "  ${{ env.IMAGE_PREFIX }}-frontend:sha-${GITHUB_SHA::7}"
          echo ""
          echo "To enable automatic SSH deploy, configure repository secrets:"
          echo "  STAGING_HOST, STAGING_USER, STAGING_SSH_KEY"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://app.example.com' }}

    steps:
      - name: Production release
        run: |
          echo "Production release triggered by tag: ${GITHUB_REF_NAME}"
          echo "Pull tagged images from GHCR:"
          echo "  ${{ env.IMAGE_PREFIX }}-api:${GITHUB_REF_NAME}"
          echo "  ${{ env.IMAGE_PREFIX }}-worker:${GITHUB_REF_NAME}"
          echo "  ${{ env.IMAGE_PREFIX }}-frontend:${GITHUB_REF_NAME}"
          echo ""
          echo "Configure production secrets/vars before enabling live deploy."
